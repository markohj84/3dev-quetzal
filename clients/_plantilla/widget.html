<!--
  PLANTILLA DEL WIDGET. Cambia antes del primer deploy:
  1. Los 4 colores de :root: los mismos de home.html.
  2. Todo lo que está entre corchetes con mayúscula inicial: asistente, negocio, saludo.
  Las burbujas de inicio (chips) NO van aquí: salen de channels.web.openers en
  assistant.config.ts. Borra este comentario al terminar.
-->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[Asistente] · [Negocio]</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600..800&family=Figtree:wght@400..600&display=swap" rel="stylesheet">
<style>
:root{
  /* Los mismos 4 colores de home.html; los demás se derivan. */
  --brand:#413074; --accent:#0fb7b8; --ink:#1e1640; --paper:#f7f8fa;

  --tint:color-mix(in srgb, var(--brand) 8%, var(--paper));
  --soft:color-mix(in srgb, var(--brand) 24%, var(--paper));
  --muted:color-mix(in srgb, var(--ink) 74%, var(--paper));

  --font-display:'League Spartan',ui-sans-serif,system-ui,sans-serif;
  --font-sans:'Figtree',ui-sans-serif,system-ui,sans-serif;

  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px;
  --r-full:9999px;

  --m-fast:200ms; --m-base:420ms;
  --ease-out:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}

*{box-sizing:border-box}

html,body{height:100%}
body{
  margin:0;
  font-family:var(--font-sans);
  background:transparent;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

/* ---- panel ---- */
/* El tamaño y la posición flotante ya los resuelve el iframe host (embed.js);
   aquí el panel solo llena el contenedor que le dieron. */
.panel{
  width:100%; height:100%;
  display:flex; flex-direction:column;
  background:var(--paper);
  border-radius:20px;
  overflow:hidden;
  animation:panelIn var(--m-base) var(--ease-out) both;
}

@keyframes panelIn{ from{opacity:0; transform:translateY(10px) scale(.98)} }
@keyframes fromLeft{ from{opacity:0; transform:translateX(-14px) scale(.98)} }
@keyframes fromRight{ from{opacity:0; transform:translateX(14px) scale(.98)} }
@keyframes rise{ from{opacity:0; transform:translateY(8px)} }
@keyframes hop{ 0%,60%,100%{transform:translateY(0); opacity:.45} 30%{transform:translateY(-5px); opacity:1} }
@keyframes ping{ 0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent)} 60%{box-shadow:0 0 0 7px transparent} }

/* ---- header ---- */
.head{
  display:flex; align-items:center; gap:var(--s-3);
  padding:var(--s-4) var(--s-4) var(--s-4) var(--s-5);
  background:var(--brand); color:var(--paper);
  flex-shrink:0;
}
.avatar{
  position:relative; flex:none;
  width:40px; height:40px; display:grid; place-items:center;
  border-radius:14px 14px 14px 4px; background:var(--paper); color:var(--brand);
  font:800 19px/1 var(--font-display); padding-top:2px;
}
.avatar::after{
  content:''; position:absolute; right:-3px; bottom:-3px;
  width:12px; height:12px; border-radius:50%;
  background:var(--accent); border:2px solid var(--brand);
  animation:ping 2.4s var(--ease-out) infinite;
}
.who{flex:1; min-width:0}
.name{font:800 19px/1 var(--font-display); letter-spacing:-.01em; padding-top:2px}
.sub{display:block; margin-top:4px; font-size:12.5px; color:color-mix(in srgb, var(--paper) 78%, transparent)}
.close{
  width:34px; height:34px; flex:none;
  display:grid; place-items:center;
  background:color-mix(in srgb, var(--paper) 10%, transparent); border:none;
  border-radius:50%;
  color:var(--paper);
  cursor:pointer;
  transition:background var(--m-fast) var(--ease-out), transform var(--m-fast) var(--ease-out);
}
.close:hover{background:color-mix(in srgb, var(--paper) 20%, transparent); transform:rotate(90deg)}
.close:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.close svg{width:16px; height:16px; stroke-width:2.2}

/* ---- log ---- */
.log{
  flex:1; overflow-y:auto;
  padding:var(--s-5) var(--s-4);
  display:flex; flex-direction:column; gap:var(--s-3);
  scrollbar-width:thin;
  scrollbar-color:var(--soft) transparent;
}
.log::-webkit-scrollbar{width:6px}
.log::-webkit-scrollbar-thumb{background:var(--soft); border-radius:var(--r-full)}

/* El asistente a la izquierda en tono suave; la persona a la derecha en el color de marca. */
.turn.bot{
  align-self:flex-start; max-width:88%;
  padding:var(--s-3) var(--s-4);
  background:var(--tint);
  border-radius:18px 18px 18px 6px;
  animation:fromLeft var(--m-base) var(--ease-out) both;
}
.turn.bot p{
  margin:0 0 var(--s-2);
  font-size:14.5px; line-height:1.55;
}
.turn.bot p:last-child{margin-bottom:0}
.turn.bot a{color:var(--brand); font-weight:600; text-underline-offset:3px; word-break:break-word}
.turn.bot ul{
  margin:0 0 var(--s-2); padding:0; list-style:none;
  display:flex; flex-direction:column; gap:var(--s-1);
}
.turn.bot li{
  font-size:14.5px; line-height:1.5;
  padding-left:var(--s-4); position:relative;
}
.turn.bot li::before{
  content:''; position:absolute; left:2px; top:.6em;
  width:6px; height:6px; border-radius:50%; background:var(--accent);
}

.turn.user{
  align-self:flex-end;
  max-width:82%;
  background:var(--brand);
  border-radius:18px 18px 6px 18px;
  padding:var(--s-3) var(--s-4);
  font-size:14.5px; line-height:1.5;
  color:var(--paper);
  animation:fromRight var(--m-base) var(--ease-out) both;
}

.typing{
  align-self:flex-start;
  display:flex; gap:5px; align-items:center;
  padding:14px 16px;
  background:var(--tint);
  border-radius:18px 18px 18px 6px;
  animation:fromLeft var(--m-base) var(--ease-out) both;
}
.typing span{
  width:7px; height:7px; border-radius:var(--r-full);
  background:var(--soft);
  animation:hop 1.1s var(--ease-out) infinite;
}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

/* ---- chips ---- */
.chips{
  display:flex; flex-wrap:wrap; gap:var(--s-2);
  padding:0 var(--s-4) var(--s-3);
  flex-shrink:0;
}
.chips[hidden]{display:none}
.chip{
  font-family:var(--font-sans);
  font-size:13.5px; font-weight:500; line-height:1.2;
  padding:9px 14px;
  background:var(--paper);
  border:1.5px solid var(--soft);
  border-radius:var(--r-full);
  color:var(--brand);
  cursor:pointer;
  animation:rise var(--m-base) var(--ease-out) both;
  animation-delay:calc(var(--i, 0) * 60ms + 120ms);
  transition:background var(--m-fast) var(--ease-out),
             border-color var(--m-fast) var(--ease-out),
             transform var(--m-fast) var(--ease-out);
}
.chip:hover{background:var(--tint); border-color:var(--soft); transform:translateY(-2px)}
.chip:active{transform:scale(.96)}
.chip:focus-visible{outline:2px solid var(--brand); outline-offset:2px}

/* ---- composer ---- */
.composer{
  display:flex; align-items:flex-end; gap:var(--s-2);
  margin:0 var(--s-3) var(--s-3);
  padding:6px 6px 6px var(--s-4);
  background:var(--tint);
  border:1.5px solid transparent;
  border-radius:24px;
  flex-shrink:0;
  transition:border-color var(--m-fast) var(--ease-out), background var(--m-fast) var(--ease-out);
}
.composer:focus-within{border-color:var(--soft); background:var(--paper)}
.composer textarea{
  flex:1;
  background:transparent; border:none; resize:none;
  font-family:var(--font-sans); font-size:14.5px; line-height:1.5;
  color:var(--ink);
  max-height:96px; padding:7px 0;
}
.composer textarea::placeholder{color:var(--muted)}
.composer textarea:focus{outline:none}
.send{
  width:38px; height:38px; flex-shrink:0;
  display:grid; place-items:center;
  background:var(--accent);
  border:none; border-radius:50%;
  color:var(--ink);
  cursor:pointer;
  transition:opacity var(--m-fast) var(--ease-out), transform var(--m-fast) var(--ease-out);
}
.send:hover:not(:disabled){transform:translateY(-1px) rotate(-8deg)}
.send:active:not(:disabled){transform:scale(.9)}
.send:disabled{opacity:.35; cursor:not-allowed}
.send:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
.send svg{width:17px; height:17px; stroke-width:2.4}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>
<body>

<section class="panel" id="panel" aria-label="Conversación con [Asistente]">
  <header class="head">
    <span class="avatar" aria-hidden="true">[A]</span>
    <div class="who">
      <div class="name">[Asistente]</div>
      <span class="sub">Asistente de [Negocio]</span>
    </div>
    <button class="close" id="close" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </header>

  <div class="log" id="log" role="log" aria-live="polite"></div>

  <div class="chips" id="chips"></div>

  <div class="composer">
    <textarea id="input" rows="1" placeholder="Escribe tu mensaje" aria-label="Mensaje"></textarea>
    <button class="send" id="send" disabled aria-label="Enviar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
</section>

<script>
const log = document.getElementById('log');
const chipRow = document.getElementById('chips');
const input = document.getElementById('input');
const send = document.getElementById('send');

const sessionId = crypto.randomUUID();
// Replaced at serve time by app/widget/route.ts with config.channels.web.openers.
const OPENERS = [];

function el(cls, html){
  const d = document.createElement('div');
  d.className = cls;
  d.innerHTML = html;
  return d;
}

function push(cls, html){
  const node = el(cls, html);
  log.appendChild(node);
  log.scrollTop = log.scrollHeight;
  return node;
}

function chips(list){
  chipRow.innerHTML = '';
  if(!list || !list.length){ chipRow.hidden = true; return; }
  chipRow.hidden = false;
  list.forEach(function(t, i){
    const b = document.createElement('button');
    b.className = 'chip';
    b.style.setProperty('--i', i);
    b.textContent = t;
    b.onclick = function(){ submit(t); };
    chipRow.appendChild(b);
  });
}

/* Texto del usuario y del modelo se muestran vía innerHTML — hay que
   escaparlo, ya no son strings fijos escritos por nosotros. */
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function linkify(escaped){
  return escaped.replace(/https?:\/\/[^\s<]+/g, function(url){
    return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
  });
}

function renderBotText(text){
  return text.split(/\n\s*\n/).map(function(para){
    return '<p>' + linkify(escapeHtml(para.trim())).replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

async function submit(text){
  const value = (text || input.value).trim();
  if(!value) return;

  push('turn user', escapeHtml(value));
  input.value = '';
  input.style.height = 'auto';
  send.disabled = true;
  chips([]);

  const dots = push('typing', '<span></span><span></span><span></span>');

  let data;
  try{
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: sessionId, text: value }),
    });
    if(!res.ok) throw new Error('bad status ' + res.status);
    data = await res.json();
  }catch(err){
    dots.remove();
    push('turn bot', renderBotText('No pude conectar en este momento. Intenta de nuevo en unos segundos.'));
    return;
  }

  dots.remove();
  push('turn bot', renderBotText(data.text));
  chips(data.chips);
}

input.addEventListener('input', () => {
  send.disabled = !input.value.trim();
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 96) + 'px';
});

input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); submit(); }
});

send.addEventListener('click', () => submit());

document.getElementById('close').addEventListener('click', () => {
  window.parent.postMessage('assistant:close', '*');
});

push('turn bot', '<p>Hola, soy [Asistente], de [Negocio]. [Con qué ayudas, en una frase.]</p><p>Elige la opción que más se parezca a tu caso, o cuéntamelo con tus palabras.</p>');
chips(OPENERS);
input.focus();
</script>
</body>
</html>
